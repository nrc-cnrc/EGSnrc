#
# EGSnrc Qt mkspec for macOS: GNU C++ compilers matching the EGSnrc/egspp build.
#
# Based on Qt's macx-g++ spec. Overrides compiler names from EGSNRC_CXX and
# EGSNRC_CC (set by setup_qt_env.sh). Do not patch Homebrew Qt mkspecs.
#

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += app_bundle incremental global_init_link_order lib_version_first
QMAKE_INCREMENTAL_STYLE = sublib

qt_prefix = $$[QT_INSTALL_PREFIX]
include($$qt_prefix/mkspecs/common/macx.conf)
include($$qt_prefix/mkspecs/common/gcc-base-mac.conf)
include($$qt_prefix/mkspecs/common/g++-macx.conf)

load(qt_config)

EGSNRC_CXX = $$getenv(EGSNRC_CXX)
EGSNRC_CC  = $$getenv(EGSNRC_CC)

isEmpty(EGSNRC_CXX): error("EGSNRC_CXX is not set. On macOS, source egsnrc_bashrc_additions after configure_c++, or export EGSNRC_CXX to match egspp_$${my_machine}.conf")

QMAKE_CXX        = $$EGSNRC_CXX
QMAKE_LINK       = $$EGSNRC_CXX
QMAKE_LINK_SHLIB = $$EGSNRC_CXX

!isEmpty(EGSNRC_CC) {
    QMAKE_COMPILER      = $$EGSNRC_CC
    QMAKE_CC            = $$EGSNRC_CC
    QMAKE_LINK_C        = $$EGSNRC_CC
    QMAKE_LINK_C_SHLIB  = $$EGSNRC_CC
}
